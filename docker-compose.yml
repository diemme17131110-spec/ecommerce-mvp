services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ecommercedb

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ecommerce-api:
    build: .
    container_name: ecommerce-api
    restart: always

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/ecommercedb
      JWT_SECRET: mysecretkey
      PORT: 3000

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5